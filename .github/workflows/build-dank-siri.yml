name: Build DANK SIRI branch

on:
  push:
    branches:
      - codex/dank-siri-staff-voice

permissions:
  contents: write

jobs:
  build-reviewed-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dank-siri-staff-voice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source patch
        run: git apply --index dank-siri-source.patch
      - name: Build deploy artifact
        run: bash pos/build.sh
      - name: Run DANK SIRI regression tests
        run: |
          node pos/__tests__/dank-siri.test.cjs
          node pos/__tests__/assistant-lookup.test.cjs
          git diff --check
      - name: Replace staging files with reviewed build
        run: |
          rm dank-siri-source.patch
          rm .github/workflows/build-dank-siri.yml
          git add pos/app.fixed.jsx pos/__tests__/assistant-lookup.test.cjs pos/__tests__/dank-siri.test.cjs index.html dank-siri-source.patch .github/workflows/build-dank-siri.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add DANK SIRI so staff can ask and navigate by voice"
          git push origin HEAD:codex/dank-siri-staff-voice
